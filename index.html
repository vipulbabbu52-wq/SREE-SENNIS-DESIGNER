<style>
:root{--p:#4a4a4a;--cream:#ffffff;--deep:#000000;--tx:#000000;--bd:#b5b5b5;--card:#fff;--ok:#000000;--er:#000000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cream);color:var(--tx);font:15px system-ui,"Noto Sans Tamil",sans-serif}
h1,h2,h3,.brand{font-family:Georgia,"Times New Roman",serif;color:var(--deep)}
header{padding:14px 16px;border-bottom:1px solid var(--bd)}
.brand{font-size:22px;letter-spacing:2px;margin:0}.tag{font-size:12px;font-style:italic;color:var(--p)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;background:none;border:1px solid var(--bd);color:var(--tx);padding:8px 12px;border-radius:20px;cursor:pointer}
nav button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:12px;margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 120px}
.btn{background:var(--deep);color:#fff;border:0;padding:10px 16px;border-radius:6px;cursor:pointer;width:auto}
.btn.alt{background:none;color:var(--deep);border:1px solid var(--deep)}.btn.red{background:var(--er)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat b{display:block;font-size:20px;color:var(--deep)}.stat span{font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--bd);font-size:13px}
.ok{color:var(--ok)}.er{color:var(--er)}.muted{opacity:.7}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--cream);padding:10px 16px;border-radius:6px;display:none;z-index:9}
.line{border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:8px}
#inv{background:#fff;color:#000;padding:20px;border:1px solid var(--bd)}#inv h2,#inv .brand{color:#000000}
#inv table th{border-bottom:2px solid #000000}
.tot td{text-align:right}
@media print{body *{visibility:hidden}#inv,#inv *{visibility:visible}#inv{position:absolute;left:0;top:0;width:100%;border:0}#inv.th{width:72mm;margin:0;border:0;padding:0}html,body{background:#fff!important}}
/* premium theme */

h1,h2,h3,.brand{font-family:"Cormorant Garamond",Georgia,serif}

#inv.th{max-width:72mm}#inv.th .tg{font:12px "Courier New",monospace;letter-spacing:0;color:#000}#inv.th .ad,#inv.th .meta,#inv.th .cu{font-size:11px;color:#000}#inv.th .bt{font-size:14px;letter-spacing:1px}#inv.th .tot{width:100%}#inv.th .ft{font-size:11px;color:#000}#inv.th table th,#inv.th table td{padding:2px 1px}#inv.th .meta{flex-direction:column;border-left:0;border-right:0}
/* polish v2 */
:root{--ease:cubic-bezier(.22,.61,.36,1);--sh:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08)}
html{scroll-behavior:smooth}::selection{background:rgba(0,0,0,.3)}
input[type=checkbox]{accent-color:var(--deep);width:18px!important;height:18px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
#m>*{animation:up .45s var(--ease) both}#m>*:nth-child(2){animation-delay:.05s}#m>*:nth-child(3){animation-delay:.1s}#m>*:nth-child(4){animation-delay:.15s}#m>*:nth-child(n+5){animation-delay:.2s}
body>div[style*="position:fixed"]{animation:fade .2s ease both}body>div[style*="position:fixed"]>.card{animation:pop .25s var(--ease) both}
#toast{animation:pop .25s var(--ease);border-radius:30px;padding:11px 20px;box-shadow:var(--sh);font-size:13px}
header{border-bottom:3px solid var(--p);padding:22px 16px 18px}
.hl{box-shadow:0 4px 18px rgba(0,0,0,.25);transition:transform .4s var(--ease)}.hl:hover{transform:rotate(-4deg) scale(1.05)}
.brand{text-shadow:0 1px 2px rgba(0,0,0,.15)}
nav{backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--bd)}
nav button{position:relative;transition:color .2s,background .2s}nav button:hover{color:var(--deep);background:rgba(0,0,0,.08)}
nav button.on{font-weight:600}
.card{box-shadow:var(--sh);border-color:transparent;transition:transform .25s var(--ease),box-shadow .25s}
.grid .card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.08),0 14px 30px rgba(0,0,0,.14)}
.btn{transition:transform .15s var(--ease),box-shadow .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.28)}.btn:active{transform:translateY(1px);box-shadow:none}
.btn.alt:hover{background:var(--deep);color:#fff}.btn.red:hover{box-shadow:0 6px 14px rgba(0,0,0,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.hello{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px;margin:0 2px 14px}.hello h2{margin:0;font-size:30px;font-weight:600}.hello span{font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.65}
.tw{border-radius:12px;box-shadow:var(--sh);background:var(--card);border:0}.tw table{border-collapse:separate;border-spacing:0}
.tw th{background:rgba(190,190,190,.35);padding:11px 10px;position:sticky;top:0}.tw td{padding:11px 10px;border-bottom:1px solid var(--bd)}.tw tr:last-child td{border-bottom:0}
.tw td:last-child,.tw th:last-child{text-align:right}
.tw td,.tw th{white-space:nowrap}.bg{display:inline-block;white-space:nowrap;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:.3px;background:rgba(0,0,0,.15);color:var(--deep)}
.bg.Paid{background:rgba(0,0,0,.14);color:var(--ok)}.bg.Unpaid{background:rgba(0,0,0,.12);color:var(--er)}.bg.Cancelled{background:rgba(120,120,120,.18);color:#777;text-decoration:line-through}
.muted.card{text-align:center;padding:34px 16px;font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;opacity:.8}
.line{transition:border-color .2s,box-shadow .2s}.line:hover{border-color:var(--p);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.ft2{text-align:center;font:italic 13px "Cormorant Garamond",Georgia,serif;letter-spacing:2px;color:var(--p);padding:6px 0 28px}

<script>
const K='sennis_v1',TABS=['Dashboard','New Bill','History','Customers','Services','Reports','Backup','Settings'];
const ADDR='398, Avinashi Road, Near Bawwa Pharmacy, Pushpa Theatre, Tiruppur, Tamil Nadu – 641604, India.';
let S={services:['Blouse Stitching','Designer Blouse Stitching','Saree Fall Stitching','Pico Work','Chudidar Stitching','Kurti Stitching','Dress Stitching','Alteration','Embroidery Work','Custom Tailoring','Other Tailoring Service'].map((n,i)=>({id:i+1,name:n,price:0,active:true})),bills:[],seq:{},sid:20};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const lsSave=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};let dbDoc=null,pt=0;
const sy=t=>{const e=document.getElementById('sy');if(e)e.textContent=t};
const push=()=>{if(!dbDoc)return;clearTimeout(pt);pt=setTimeout(()=>{dbDoc.set({rev:S.rev,json:JSON.stringify(S)}).then(()=>sy('Synced across your devices')).catch(()=>sy('Sync failed. Data is saved on this device only'))},400)};
const save=()=>{S.rev=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save in this browser')}push()};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=p=>'₹'+(p/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const P=v=>Math.round((parseFloat(v)||0)*100);
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
const paid=b=>b.payments.reduce((a,p)=>a+p.amt,0);
const bal=b=>b.total-paid(b);
const pst=b=>b.cancelled?'Cancelled':bal(b)<=0?'Paid':paid(b)>0?'Partially Paid':'Unpaid';
let tab='Dashboard',lines=[],range={f:'',t:''},q='';
function go(t){tab=t;$('nav').innerHTML=TABS.map(x=>`<button class="${x==t?'on':''}" onclick="go('${x}')">${x}</button>`).join('');
 if(t=='New Bill'){lines=[{sid:'',name:'',qty:1,price:''}]}
 ({'Dashboard':dash,'New Bill':nb,'Services':svc,'History':hist,'Backup':bk,'Customers':cust,'Reports':rpt,'Settings':sett})[t]()}
function dash(){
 let bs=S.bills.filter(b=>(!range.f||b.date>=range.f)&&(!range.t||b.date<=range.t));
 const act=bs.filter(b=>!b.cancelled),bt=act.reduce((a,b)=>a+b.total,0),rc=act.reduce((a,b)=>a+paid(b),0);
 const td=S.bills.filter(b=>b.date==today()).length;
 $('m').innerHTML=`<div class="hello"><h2>Dashboard</h2><span>${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Kolkata'})}</span></div><div class="card"><div class="row"><div><label>From</label><input type="date" id="rf" value="${range.f}"></div><div><label>To</label><input type="date" id="rt" value="${range.t}"></div><button class="btn alt" onclick="range={f:$('rf').value,t:$('rt').value};dash()" style="align-self:end">Apply</button></div></div>
 <div class="grid"><div class="card stat"><b>${act.length}</b><span>Bills issued</span></div><div class="card stat"><b>${fmt(bt)}</b><span>Billed</span></div><div class="card stat"><b>${fmt(rc)}</b><span>Received</span></div><div class="card stat"><b>${fmt(bt-rc)}</b><span>Outstanding</span></div><div class="card stat"><b>${td}</b><span>Bills today</span></div></div>
 <button class="btn" onclick="go('New Bill')">+ New Bill</button> <button class="btn alt" onclick="go('History')">Search bills</button>
 <h3>Recent bills</h3>${S.bills.length?tbl(S.bills.slice(-5).reverse()):'<div class="card muted">No bills yet. Create your first bill.</div>'}`}
function tbl(bs){return `<div class="tw"><table><tr><th>No</th><th>Date</th><th>Customer</th><th>Total</th><th>Balance</th><th>Status</th><th></th></tr>${bs.map(b=>`<tr><td>${b.no}</td><td>${b.date}</td><td>${esc(b.cust.name)}</td><td>${fmt(b.total)}</td><td>${fmt(b.cancelled?0:bal(b))}</td><td><span class="bg ${pst(b).replace(" ","")}">${pst(b)}</span></td><td><button class="btn alt" onclick="view('${b.no}')">Open</button></td></tr>`).join('')}</table></div>`}
function nb(){
 $('m').innerHTML=`<div class="card"><h3>Customer</h3><label><input type="checkbox" id="walk" style="width:auto" onchange="$('cf').style.display=this.checked?'none':'block'"> Walk-in customer</label>
 <div id="cf"><label>Full name</label><input id="cn" list="cl"><datalist id="cl">${[...new Set(S.bills.map(b=>b.cust.name))].filter(Boolean).map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
 <label>Mobile</label><input id="cp" inputmode="tel"><label>Address (optional)</label><input id="ca"></div></div>
 <div class="card"><h3>Services</h3><div id="ls"></div><button class="btn alt" onclick="syncL();lines.push({sid:'',name:'',qty:1,price:''});rl()">+ Add line</button></div>
 <div class="card"><div class="row"><div><label>Discount type</label><select id="dt" onchange="tot()"><option value="f">Fixed ₹</option><option value="p">Percent %</option></select></div><div><label>Discount</label><input id="dv" type="number" min="0" step="0.01" oninput="tot()"></div></div>
 <div class="row"><div><label>Payment type</label><select id="pt" onchange="ptc()"><option value="full">Full payment</option><option value="adv">Advance payment (balance due later)</option><option value="due">Nothing paid now (full amount due)</option></select></div><div><label>Method</label><select id="pm"><option>Cash</option><option>UPI</option></select></div></div><div class="row"><div><label id="pal">Amount received (₹)</label><input id="pa" type="number" min="0" step="0.01" oninput="tot()"></div><div><label>UPI / reference no. (optional)</label><input id="px" maxlength="40"></div></div>
 <label>Delivery date (when you give the order to the customer)</label><input id="dd" type="date"><label>Notes (optional)</label><textarea id="nt" rows="2"></textarea>
 <div id="tt" style="margin-top:10px"></div><button class="btn" id="iss" onclick="issue()">Issue bill</button></div>`;rl()}
function rl(){$('ls').innerHTML=lines.map((l,i)=>`<div class="line"><select onchange="pick(${i},this.value)"><option value="">Custom service…</option>${S.services.filter(s=>s.active).map(s=>`<option value="${s.id}" ${l.sid==s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
 <input placeholder="Service name" value="${esc(l.name)}" oninput="lines[${i}].name=this.value" style="margin-top:6px"><div class="row"><div><label>Qty</label><input type="number" min="1" step="1" value="${l.qty}" oninput="lines[${i}].qty=this.value;tot()"></div><div><label>Unit price ₹</label><input type="number" min="0" step="0.01" value="${l.price}" oninput="lines[${i}].price=this.value;tot()"></div></div>
 ${lines.length>1?`<button class="btn alt" style="margin-top:6px" onclick="syncL();lines.splice(${i},1);rl()">Remove</button>`:''}</div>`).join('');tot()}
function syncL(){}
function pick(i,v){const s=S.services.find(x=>x.id==v);lines[i].sid=v;if(s){lines[i].name=s.name;lines[i].price=s.price?(s.price/100):''}rl()}
function calc(){let sub=0;lines.forEach(l=>{sub+=Math.round(parseFloat(l.qty)||0)*P(l.price)});
 const dv=parseFloat(($('dv')||{}).value)||0,pc=($('dt')||{}).value=='p';
 let d=pc?Math.round(sub*dv/100):P(dv);const pa=P(($('pa')||{}).value);
 return{sub,d,total:sub-d,pa}}
function ptc(){const t=$('pt').value,a=$('pa');a.disabled=t=='due';if(t!='full')a.value='';$('pm').disabled=t=='due';$('pal').textContent=t=='adv'?'Advance amount (₹)':t=='due'?'Amount received (₹): none':'Amount received (₹)';tot()}
function tot(){const e=$('tt');if(!e)return;const pt=$('pt');if(pt&&pt.value=='full'&&document.activeElement!==$('pa')){const t0=calc().total;$('pa').value=t0>0?t0/100:''}const c=calc();e.innerHTML=`<table class="tot"><tr><td>Subtotal</td><td>${fmt(c.sub)}</td></tr><tr><td>Discount</td><td>−${fmt(c.d)}</td></tr><tr><td><b>Final payable</b></td><td><b>${fmt(c.total)}</b></td></tr><tr><td>Received</td><td>${fmt(c.pa)}</td></tr><tr><td><b>${c.pa>c.total?'Change to give':'Balance'}</b></td><td><b>${fmt(Math.abs(c.total-c.pa))}</b></td></tr></table>`}
function issue(){const c=calc(),walk=$('walk').checked,tp=$('pt').value;if(tp=='due')c.pa=0;
 const ls=lines.map(l=>({name:l.name.trim(),qty:Math.round(parseFloat(l.qty)||0),price:P(l.price)}));

function view(no){const b=S.bills.find(x=>x.no==no),sn=b.snap||{};tab='';

function addPay(no){const b=S.bills.find(x=>x.no==no),a=P($('pay').value);if(a<=0||a>bal(b))return toast('Enter an amount up to the balance');
 b.payments.push({amt:a,method:$('pmm').value,date:today()});b.log.push({t:new Date().toISOString(),a:'Payment '+fmt(a)});save();toast('Payment recorded');view(no)}
function cancelB(no){dlg('Reason for cancellation (required):',r=>{if(!r.trim())return toast('Reason is required');const b=S.bills.find(x=>x.no==no);
 b.cancelled=true;b.reason=r.trim();b.log.push({t:new Date().toISOString(),a:'Cancelled: '+r.trim()});save();view(no)},true)}
function svc(){$('m').innerHTML=`<div class="card"><h3>Add service</h3><div class="row"><input id="sn" placeholder="Service name"><input id="sp" type="number" min="0" step="0.01" placeholder="Default price ₹"><button class="btn" onclick="addS()">Add</button></div></div>

function rpt(){if(!rp.f&&!rp.t)rp={f:today().slice(0,8)+'01',t:today()};const r=rdata(),bt=r.act.reduce((a,b)=>a+b.total,0),od=r.act.reduce((a,b)=>a+bal(b),0),rc=r.pays.reduce((a,x)=>a+x.amt,0),ct=r.can.reduce((a,b)=>a+b.total,0);
 const mt={},dy={},D=d=>dy[d]=dy[d]||{n:0,b:0,r:0};r.pays.forEach(x=>{mt[x.method]=(mt[x.method]||0)+x.amt;D(x.date).r+=x.amt});r.act.forEach(b=>{const o=D(b.date);o.n++;o.b+=b.total});
 window._rows=Object.keys(dy).sort().reverse().map(d=>[d,dy[d].n,dy[d].b/100,dy[d].r/100]);
 $('m').innerHTML=`<div class="card"><div class="row"><button class="btn alt" onclick="rng('d')">Today</button><button class="btn alt" onclick="rng('w')">Last 7 days</button><button class="btn alt" onclick="rng('m')">This month</button></div><div class="row" style="margin-top:8px"><div><label>From</label><input type="date" id="r1" value="${rp.f}"></div><div><label>To</label><input type="date" id="r2" value="${rp.t}"></div><button class="btn" style="align-self:end" onclick="rp={f:$('r1').value,t:$('r2').value};rpt()">Apply</button></div></div>
 <div class="grid"><div class="card stat"><b>${fmt(bt)}</b><span>Billed (${r.act.length} bills)</span></div><div class="card stat"><b>${fmt(rc)}</b><span>Payments received</span></div><div class="card stat"><b>${fmt(od)}</b><span>Outstanding</span></div><div class="card stat"><b>${r.can.length}</b><span>Cancelled (${fmt(ct)})</span></div></div>
 <div class="card"><h3>Payment methods</h3>${Object.keys(mt).length?Object.entries(mt).map(([k,v])=>`<div class="m2"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join(''):'<span class="muted">No payments in this period.</span>'}</div>
 <div class="tw"><table><tr><th>Date</th><th>Bills</th><th>Billed</th><th>Received</th></tr>${window._rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${fmt(x[2]*100)}</td><td>${fmt(x[3]*100)}</td></tr>`).join('')||'<tr><td colspan="4">No bills in this period.</td></tr>'}</table></div>
 <p class="muted">Cancelled bills are left out of billed and outstanding totals.</p><button class="btn alt" onclick="rcsv()">Export CSV</button>`}
function rcsv(){const r=[['Date','Bills','Billed','Received']].concat(window._rows||[]);dlf(`report-${rp.f}-to-${rp.t}.csv`,r.map(x=>x.join(',')).join('\n'),'text/csv')}
function sett(){const t=S.set||{};$('m').innerHTML=`<div class="card"><h3>Shop details on bills</h3><p class="muted">Used on new bills only. Bills already issued keep what they had.</p><label>Phone (optional)</label><input id="s1" value="${esc(t.phone)}"><label>Email (optional)</label><input id="s2" value="${esc(t.email)}"><label>Your website address (used in WhatsApp bill links)</label><input id="s6" value="${esc(t.site)}" placeholder="https://yourname.netlify.app"><label>Footer message (optional, replaces the thank-you line)</label><textarea id="s3" rows="2">${esc(t.footer)}</textarea><label>Payment terms (optional)</label><textarea id="s4" rows="2">${esc(t.terms)}</textarea><div style="margin-top:12px"><input type="checkbox" id="s5" ${t.nonGst?'checked':''}> Print “Non-GST bill. GST has not been charged on this bill.” Tick only if this is accurate for your business.</div><button class="btn" style="margin-top:12px" onclick="svs()">Save settings</button></div>`}
function svs(){S.set={phone:$('s1').value.trim(),email:$('s2').value.trim(),footer:$('s3').value.trim(),terms:$('s4').value.trim(),nonGst:$('s5').checked,site:$('s6').value.trim().replace(/#.*$/,'')};save();toast('Settings saved')}
function bk(){$('m').innerHTML=`<div class="card"><h3>Backup</h3><p>Download all data as JSON. Keep the file private. This app stores data in this browser only, so back up regularly.</p><button class="btn" onclick="dl()">Download backup</button><button class="btn alt" onclick="csv()" style="margin-left:6px">Bills CSV</button></div>
 <div class="card"><h3>Restore</h3><p class="er">Restoring replaces all current data on this device.</p><input type="file" accept=".json" id="rf2"><label>Or paste backup text</label><textarea id="rp" rows="3"></textarea><button class="btn alt" style="margin-top:8px" onclick="rs()">Restore</button></div>`}
async function dlf(n,t,m){let d=null;try{d=await claude.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:n,data:t});return toast('File saved')}catch(e){if(e&&e.code=='declined')return}}
 const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px';
 o.innerHTML='<div class="card" style="max-width:520px;width:100%;margin:0"><h3>Copy your data</h3><p>Downloads are not available here. Copy this text and save it in a private file.</p><textarea id="cpt" rows="8" readonly></textarea><div class="row" style="margin-top:10px"><button class="btn" id="cpb">Copy</button><button class="btn alt" id="cpc">Close</button></div></div>';
 document.body.appendChild(o);$('cpt').value=t;$('cpc').onclick=()=>o.remove();$('cpb').onclick=()=>{$('cpt').select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'Copied':'Select the text and copy it')}}
function dl(){dlf(`sennis-backup-${today()}.json`,JSON.stringify({created:new Date().toISOString(),version:1,data:S},null,1),'application/json')}
function csv(){const r=[['Bill','Date','Customer','Mobile','Total','Paid','Balance','Status']].concat(S.bills.map(b=>[b.no,b.date,b.cust.name,b.cust.phone,b.total/100,paid(b)/100,b.cancelled?0:bal(b)/100,pst(b)]));
 dlf('bills.csv',r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function rs(){const f=$('rf2').files[0],pt=$('rp').value.trim();if(!f&&!pt)return toast('Choose a file or paste backup text');const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(f?r.result:pt);const d=j.data;
 if(!d||!Array.isArray(d.bills)||!Array.isArray(d.services)||!d.seq)throw 0;
 return dlg(`Replace current data (${S.bills.length} bills) with backup (${d.bills.length} bills)?`,()=>{S=d;save();toast('Restored');go('Dashboard')})}catch(e){toast('Invalid backup file')}};if(f)r.readAsText(f);else r.onload()}
function dlg(msg,cb,inp){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px';o.innerHTML=`<div class="card" style="max-width:380px;width:100%;margin:0"><h3>Please confirm</h3><p>${esc(msg)}</p>${inp?'<input id="dgi">':''}<div class="row" style="margin-top:12px"><button class="btn alt" id="dgn">Cancel</button><button class="btn" id="dgy">Confirm</button></div></div>`;document.body.appendChild(o);$('dgn').onclick=()=>o.remove();$('dgy').onclick=()=>{const v=inp?$('dgi').value:'';o.remove();cb(v)}}
const CM=(location.hash.match(/^#b=([A-Za-z0-9_-]+)$/)||[])[1];
function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return JSON.parse(decodeURIComponent(escape(atob(t))))}
function addDays(d,n){const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function pack(b){const n=b.snap||{};return ['v1',b.no,b.date,b.due,b.cust.name,b.cust.phone,b.cust.addr,b.lines.map(l=>[l.name,l.qty,l.price]),b.sub,b.disc,b.total,b.payments.map(p=>[p.amt,p.method,p.date]),b.change||0,b.ptype||'',n.phone||'',n.email||'',n.terms||'',n.footer||'',n.nonGst?1:0,b.cancelled?1:0,b.reason||'']}
function unpack(a){return{no:a[1],date:a[2],due:a[3],cust:{name:a[4],phone:a[5],addr:a[6]},lines:a[7].map(x=>({name:x[0],qty:x[1],price:x[2]})),sub:a[8],disc:a[9],total:a[10],payments:a[11].map(x=>({amt:x[0],method:x[1],date:x[2]})),change:a[12],ptype:a[13],snap:{phone:a[14],email:a[15],terms:a[16],footer:a[17],nonGst:a[18]},cancelled:!!a[19],reason:a[20],notes:''}}
function sendWA(no){const b=S.bills.find(x=>x.no==no);let base=(S.set&&S.set.site)||'';
 if(!base&&/^https?:/.test(location.href)&&location.hostname.indexOf('claude')<0)base=location.origin+location.pathname;
 if(!base){toast('First enter your website address in Settings');return go('Settings')}
 if(!b.due)return toast('This bill has no delivery date');
 const ex=addDays(b.due,30),link=base.replace(/#.*$/,'')+'#b='+b64e(pack(b));
 let ph=(b.cust.phone||'').replace(/\D/g,'');if(ph.length==10)ph='91'+ph;else if(!(ph.length==12&&ph.indexOf('91')==0))ph='';
 const msg=`Hello ${b.cust.name}, thank you for choosing SREE SENNIS DESIGNER.\nBill ${b.no}: Total ${fmt(b.total)}, Paid ${fmt(paid(b))}, Balance ${fmt(bal(b))}.\nDelivery date: ${b.due}\nView your bill here (available until ${ex}):\n${link}`;
 const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px';
 o.innerHTML=`<div class="card" style="max-width:520px;width:100%;margin:0"><h3>Send on WhatsApp</h3><p>The customer can view this bill until <b>${ex}</b> (30 days after delivery).</p><textarea id="wat" rows="6" readonly></textarea><div class="row" style="margin-top:10px"><a class="btn" id="waa" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Open WhatsApp</a><button class="btn alt" id="wac">Copy message</button><button class="btn alt" id="wax">Close</button></div></div>`;
 document.body.appendChild(o);$('wat').value=msg;$('waa').href='https://wa.me/'+ph+'?text='+encodeURIComponent(msg);$('wax').onclick=()=>o.remove();
 $('wac').onclick=()=>{$('wat').select();let k=false;try{k=document.execCommand('copy')}catch(e){}toast(k?'Copied':'Select the text and copy it')}}
function showCust(){document.body.classList.add('cust');$('nav').innerHTML='';let b;
 try{b=unpack(b64d(CM));if(!/^\d{4}-\d\d-\d\d$/.test(b.due))throw 0}catch(e){$('m').innerHTML='<div class="card muted">This bill link is not valid.</div>';return}
 const ex=addDays(b.due,30);
 if(today()>ex){$('m').innerHTML='<div class="card muted">This bill link has expired.<br><small>Please contact SREE SENNIS DESIGNER for a copy.</small></div>';return}
 $('m').innerHTML=`<div class="card" style="text-align:center">Your bill is available to view until <b>${ex}</b>.</div>`+invoice(b,b.snap)}

function pr(th){const el=$('inv');el.classList.toggle('th',!!th);const pg=th?'@page{size:80mm auto;margin:3mm}':'@page{size:A4;margin:14mm}';
 const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n')+pg+'body{background:#fff;margin:0}#inv{position:static!important;border:0}';
 let w=null;try{w=window.open('','_blank')}catch(e){}
 if(!w){$('pg').textContent=pg;setTimeout(()=>window.print(),50);return toast('Pop-up blocked. Allow pop-ups, or open the page in a full browser tab to print.')}
 w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bill</title><style>'+css+'</style></head><body>'+el.outerHTML+'</body></html>');w.document.close();
 setTimeout(()=>{w.focus();w.print()},500)}
(async()=>{if(CM)return;let DB=null;try{DB=await claude.use('db')}catch(e){}
 if(!DB){sy('Saved on this device only');return}
 dbDoc=DB.doc('app/state');
 const load=d=>{try{S=JSON.parse(d.json);lsSave();if(tab=='Dashboard'||tab=='History')go(tab)}catch(e){}};
 try{const r=await dbDoc.get();if(r.exists){const d=r.data();if((d.rev||0)>(S.rev||0))load(d);else if((S.rev||0)>(d.rev||0))push();else sy('Synced across your devices')}else if(S.bills.length||S.rev)push();else sy('Synced across your devices')}catch(e){sy('Sync unavailable. Data is saved on this device only')}
 try{dbDoc.onSnapshot(sn=>{if(sn&&sn.exists){const d=sn.data();if((d.rev||0)>(S.rev||0))load(d)}})}catch(e){}
})();
try{$('yr').textContent=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}).slice(0,4)}catch(e){}
if(CM)showCust();else go('Dashboard');
</script><script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(function(){})</script></body></html>
